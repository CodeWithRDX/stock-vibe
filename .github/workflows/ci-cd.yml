name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # Continuous Integration (Runs on PR & Push)
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-id: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # 1. Backend CI
      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Run Backend Tests
        run: cd server && npm run test

      # 2. Frontend CI
      - name: Install Frontend Dependencies
        run: cd client && npm ci --legacy-peer-deps

      - name: Build Frontend
        run: cd client && npm run build

      # 3. Docker Build Verification
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: false

      - name: Verify Frontend Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.client
          push: false

  # Continuous Deployment (Runs on Merge to main)
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # SSH Deploy to AWS EC2
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app
            if [ ! -d ".git" ]; then
              echo "Repository not initialized on EC2. Initializing git and checking out main..."
              git init
              git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch --all
              git checkout -f main
            else
              echo "Repository exists. Pulling latest changes..."
              git reset --hard
              git pull origin main
            fi
            # Rebuild and start container services directly using Docker Compose
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            # Execute database seeds
            docker exec stockvibe_backend npm run seed
            # Prune unused image remnants
            docker image prune -f
