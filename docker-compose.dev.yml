services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: npm run dev
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/inventory_db
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=dev_secret_access_token_key_123!@#
      - JWT_REFRESH_SECRET=dev_secret_refresh_token_key_456!@#
      - CLIENT_URL=http://localhost:3000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: stockvibe_frontend:dev
    container_name: stockvibe_frontend_dev
    working_dir: /usr/src/app
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:5000
